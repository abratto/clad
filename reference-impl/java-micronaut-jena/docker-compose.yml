# Build the CLAD app JAR, then run it as a container.
# Usage:
#   cd reference-impl/java-micronaut-jena
#   mvn package -DskipTests
#   docker compose up --build
#
# The app connects to Ollama and Fuseki by service name — no
# hardcoded IPs, no port conflicts on the host.

services:
  # 1. The CLAD runtime — Micronaut + concepts + syncs + engine
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Triplestore — Fuseki over HTTP (persistent, production-grade)
      ENGINE_DATASET_TYPE: fuseki
      CLAD_FUSEKI_ENDPOINT: http://fuseki:3030/clad/update
      CLAD_FUSEKI_USERNAME: admin
      CLAD_FUSEKI_PASSWORD: "${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD}"
      # LLM — Ollama over HTTP (runs your model of choice)
      CLAD_LLM_ENDPOINT: http://ollama:11434
      CLAD_LLM_MODEL: llama3.2:3b
      # Micronaut
      MICRONAUT_ENVIRONMENTS: production
      # Split query/update endpoints — CONSTRUCT on update endpoint returns 400
      CLAD_FUSEKI_QUERY: http://fuseki:3030/clad/query
      CLAD_FUSEKI_UPDATE: http://fuseki:3030/clad/update
      # Disable flow archival in production — the action log grows without
      # bound on long-lived deployments. Set to true for debug/inspection.
      CLAD_ARCHIVE_FLOWS: "false"
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped

  # 2. Apache Jena Fuseki — persistent triplestore (Jena 6.0.0, multi-arch)
  # conceptkernel/jena-fuseki supports arm64 (Apple Silicon) natively.
  fuseki:
    image: conceptkernel/jena-fuseki:latest
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: "${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD}"
    volumes:
      - fuseki_data:/fuseki
      - ./fuseki/config.ttl:/fuseki/run/configuration/clad.ttl:ro
    user: "0:0"  # required for macOS host volume permissions
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. Ollama — local LLM runtime (CPU or GPU)
  # Change the model in CLAD_LLM_MODEL env var above.
  # First run: docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  fuseki_data:
  ollama_data:
