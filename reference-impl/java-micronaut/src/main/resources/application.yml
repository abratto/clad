micronaut:
  router:
    static-resources:
      public:
        paths: classpath:public
        mapping: /**

# Concept-state backend: `memory` (default, no database needed) or `postgres`.
# The engine's FactStore SPI is the boundary, so concepts and syncs are
# identical either way; only where state persists changes. Postgres-specific
# beans (datasource, StoreInitializer) are inert unless clad.storage=postgres.
clad:
  storage: memory

datasources:
  default:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clad}
    username: ${PGUSER:clad}
    password: ${PGPASSWORD:clad}
    driver-class-name: org.postgresql.Driver
    # Hikari pool (micronaut-jdbc-hikari). Concept actions borrow per
    # statement; the pool removes per-operation connection setup.
    maximum-pool-size: ${PGPOOL_MAX:10}
    minimum-idle: ${PGPOOL_MIN_IDLE:2}
    connection-timeout: 5000
    pool-name: clad-micronaut
