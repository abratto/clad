name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check.json'

  hard-rule-r1:
    name: R1 — no cross-concept imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect concept-to-concept imports
        run: bash .github/scripts/check-no-cross-concept-imports.sh

  tracking-hygiene:
    name: Tracking overlay (ROADMAP.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ROADMAP.md hygiene
        run: bash .github/scripts/check-roadmap-hygiene.sh

  artefact-gate:
    name: Artefact pipeline + quality-gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Artefact pipeline gate
        run: python3 quality-gate/verify_artefacts.py
      - name: Quality-gate regression tests
        run: python3 -m pytest quality-gate/tests -q

  java-verify:
    name: Java reference profile (canonical java-legible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Canonical profile module + its reactor deps. The durable profiles
      # (legible-storage, java-micronaut-postgres) add Docker/Testcontainers;
      # run the full reactor `mvn -B -ntp test -f reference-impl/pom.xml` in a
      # Docker-capable job when validating those.
      - name: mvn test (java-legible)
        run: mvn -B -ntp test -f reference-impl/pom.xml -pl java-legible -am
