# CLAD project-wide settings
#
# Edit this file to configure your project. It works with any agent
# framework (Cline, Copilot, Cursor, Roo, Codex, …).

# --- Canonical test command ---
# The single shell command that runs the CLAD artefact pipeline gate first,
# then the profile's test framework. An artefact defect blocks test feedback
# entirely — the agent cannot get a green test run until the pipeline is intact.
#
# The artefact gate (verify_artefacts.py) auto-discovers all UC-* features and
# runs the stage-sequence guard plus per-stage checks. Tests only execute after
# the gate passes.
#
# Assumes cwd is the repo root.
# Examples:
#   mvn test
#   ./gradlew test
#   npm test
#
# Scoped to the canonical profile module so the gate runs without Docker. The
# full-reactor command below additionally builds the durable profiles whose
# tests need Testcontainers (Docker); run it in CI, not in a bare environment:
#   mvn test -f reference-impl/pom.xml
test.command=python3 quality-gate/verify_artefacts.py && mvn test -f reference-impl/pom.xml -pl java-legible -am

# --- Workflow control (two independent dimensions) ---
# These control the behaviour of quality-gate/advance.py between stages.
# Each is a deliberate human choice; the agent must NEVER change either on
# its own initiative (see AGENTS.md §2 principle 13).
#
# workflow.autonomous
#   true  — Do NOT wait at human gates: advance.py records each of the 3
#           gates as `auto-approved` and moves on. Deterministic checks STILL
#           run and STILL block on failure. Use when you trust the agent's
#           design judgement but want the mechanical guards kept.
#   false — (default, safest) Stop and wait for the human at all three human
#           gates (Requirements, Architecture, Executable spec). Run every
#           deterministic check; block on any failure.
#
# workflow.session-per-stage
#   true  — After EVERY stage writes its output, advance.py stops (exit 30)
#           and prints a deterministic fresh-session handoff prompt (the
#           HANDOVER.md block, feature slug substituted). The operator starts
#           a new session whose only inputs are the on-disk artefacts. This
#           caps the context window at a single stage's worth of material.
#   false — (default) One continuous session; advance.py proceeds stage to
#           stage without a handoff.
#
# CLAD cannot clear the model's context window itself — that is the
# harness's job. session-per-stage=true is the stop-and-hand-off contract.
# Auto-approved gates are recorded as `auto-approved` (not `approved`) so a
# reviewer can always see which gates a human never inspected.
workflow.autonomous=false
workflow.session-per-stage=false

# --- Storage layer ---
# A human-readable description of your persistence technology.
# Used by the Stage 04a storage-mapping context to tell the agent what
# storage primitives it should model.
# Examples:
#   In-memory FactStore relations (canonical fire-after-commit profile)
#   Jena TDB2 named graph (legacy transactional profile)
#   PostgreSQL schema per application, concept-prefixed tables (Java/Micronaut profile)
storage.layer=In-memory FactStore relations (canonical fire-after-commit profile; durable Postgres option via reference-impl/java-micronaut-postgres R-map profile; Jena/Postgres available as FactStore implementations)

# --- JSON serialization ---
# CLAD syncs author field-value maps where missing fields imply null.
# Set your framework's JSON serializer to always include null values
# rather than omitting them. The Conduit spec asserts e.g.
#   jsonpath "$.user.bio" == null
# which fails with 'none' when nulls are omitted.
#
# Documentation-only: CLAD does not read this key. It records the canonical
# profile's setting (R13) so a derived profile can honour it.
jackson.serialization-inclusion=always

# --- Implementation paths (for profile-specific quality checks) ---
# Paths relative to the repo root. Used by quality-gate scripts that scan
# implementation files (Java, Kotlin, etc.). If a path is unset or does not
# exist at check time, the check skips automatically. Feature-local
# `_config/<key>.md` overrides win over these root values; upstream CLAD
# v0.3.4 ships `verify_profile_paths.py` binding them to package-and-layout.
# Examples (default java-legible profile):
#   sync.impl.dir=reference-impl/java-legible/src/main/java/dev/legible/example/login
#   concept.impl.dir=reference-impl/java-legible/src/main/java/dev/legible/example/login
#   test.source.root=reference-impl/java-legible/src/test/java
sync.impl.dir=reference-impl/java-legible/src/main/java/dev/legible/example/login
concept.impl.dir=reference-impl/java-legible/src/main/java/dev/legible/example/login
# `test.source.root` is the TEST SOURCE ROOT: the directory that *contains*
# package directories (e.g. `app/src/test/java`), NEVER a package directory
# itself. Stage 04d/04e derivation maps record their test-file paths relative
# to it, and the profile checks walk it for test classes. A package-inclusive
# value makes red-test continuity resolve every row to a non-existent path.
test.source.root=reference-impl/java-legible/src/test/java

# --- System-scope concept corpus (Model B) ---
# Repo-root-relative path to the canonical concept corpus (one
# `<Name>.concept.md` per concept). Concept-reading checks resolve this FIRST,
# then fall back to a feature's own `02_concepts/output/`; a feature's NEW/EXTEND
# proposal shadows the corpus spec of the same name. If unset or absent, a
# feature behaves exactly as the pre-Model-B per-feature model.
concepts.dir=features/_system/concepts
